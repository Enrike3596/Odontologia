<!-- Sidebar reutilizable - Sistema Odontológico.
     Enlaces alineados con VistaController y los templates reales:
     /dashboard (home.html), /citas, /agenda (solo admin), /pacientes,
     /odontologos, /historias-clinicas, /usuarios, /configuracion. -->
<nav class="sidebar">
    <button type="button" class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" aria-label="Colapsar menú" title="Colapsar menú">
        <i class="fas fa-chevron-left"></i>
    </button>
    <div class="sidebar-header">
        <!-- Cabecera fija del sidebar (no hace scroll) -->
    </div>
    <ul class="sidebar-menu custom-scrollbar">
        <li>
            <a href="/dashboard" data-view="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="/citas" data-view="citas">
                <i class="fas fa-calendar-check"></i>
                <span>Citas Médicas</span>
            </a>
        </li>
        <li data-require-admin="true">
            <a href="/agenda" data-view="agenda">
                <i class="fas fa-calendar-days"></i>
                <span>Agenda Médica</span>
            </a>
        </li>
        <li>
            <a href="/pacientes" data-view="pacientes">
                <i class="fas fa-user-injured"></i>
                <span>Pacientes</span>
            </a>
        </li>
        <li>
            <a href="/odontologos" data-view="odontologos">
                <i class="fas fa-user-md"></i>
                <span>Odontólogos</span>
            </a>
        </li>
        <li>
            <a href="/historias-clinicas" data-view="historia">
                <i class="fas fa-file-medical"></i>
                <span>Historia Clínica</span>
            </a>
        </li>
        <li>
            <a href="/usuarios" data-view="usuarios">
                <i class="fas fa-users-cog"></i>
                <span>Usuarios</span>
            </a>
        </li>
        <li>
            <a href="/configuracion" data-view="configuracion">
                <i class="fas fa-cogs"></i>
                <span>Configuración</span>
            </a>
        </li>
    </ul>
    <div class="sidebar-footer">
        <button type="button" class="sidebar-logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Cerrar Sesión</span>
        </button>
    </div>
</nav>
