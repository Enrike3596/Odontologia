spring.application.name=odontologia

# Sesión del lado servidor (fortalecimiento del login): la JSESSIONID es
# HttpOnly (no legible desde JS) y SameSite=Lax (no viaja en peticiones
# cross-site: mitiga CSRF en los POST/PUT/DELETE de /api). Expira a los
# 30 minutos de inactividad.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/odontologia
spring.datasource.username=postgres
spring.datasource.password=3596
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuración
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos
# spring.sql.init.mode=always
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

